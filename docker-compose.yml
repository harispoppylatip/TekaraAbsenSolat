# ---------------------------------------------------------------------------
# Absen Solat SMKIM4
#
# Lima layanan:
#   db         MySQL 8.4, datanya di volume, portnya dibuka untuk klien luar
#   app        PHP-FPM berisi kode aplikasi, satu-satunya yang menjalankan
#              migrasi dan cache konfigurasi
#   web        nginx, satu-satunya pintu masuk pengguna
#   queue      pekerja antrean (pengubah foto wajah menjadi angka)
#   scheduler  penjadwal: menyiapkan sesi absen harian, membuka dan menutup
#              sesi setiap menit, serta membersihkan data wajah tiap hari
#
# Semua pengaturan dibaca dari berkas .env. Kunci yang khusus Docker memakai
# akhiran _DOCKER supaya .env tetap bisa dipakai untuk pengembangan di
# komputer (php artisan serve) tanpa saling menimpa.
#
# Kunci di bawah ini dipakai bersama oleh aplikasi di dalam dan di luar
# container, jadi tidak memakai akhiran _DOCKER dan cukup diatur sekali:
#
#   SOLAT_LATE_MINUTES         menit toleransi keterlambatan (bawaan 10)
#   SOLAT_DEVICE_ID            kode perangkat kamera absen (kamera-wajah)
#   SOLAT_EARLY_OPEN_MINUTES   menit sebelum jam mulai saat sesi boleh
#                              dibuka (bawaan 10)
#   SOLAT_SESSION_CREATE_TIME  jam penyiapan sesi harian (bawaan 00:05)
#   SOLAT_PREPARE_DAYS_AHEAD   hari sesudah hari ini yang ikut disiapkan
#                              sesinya (bawaan 1, isi 0 bila hanya hari ini)
#
#   FACE_SERVICE_URL           alamat mesin wajah
#   FACE_TOLERANCE             jarak terjauh yang diterima sebagai anggota
#                              yang sama (bawaan 0.5)
#   FACE_AGGREGATE_PHOTOS      berapa jarak foto terdekat yang dirata-ratakan
#                              saat menilai anggota (bawaan 2)
#   FACE_SINGLE_PHOTO_TOLERANCE batas lebih ketat bagi anggota yang fotonya
#                              kurang dari jumlah di atas (bawaan 0.45)
#   FACE_MIN_MARGIN            selisih minimal juara pertama dan kedua, di
#                              bawah angka ini hasilnya dinyatakan ambigu
#   FACE_MIN_FACE_SIZE         sisi wajah paling kecil dalam piksel yang boleh
#                              diputuskan (bawaan 80, isi 0 untuk mematikan)
#   FACE_ENFORCE_MODEL         lewati angka wajah yang dihitung model lain
#
# Di dalam Docker alamat mesin wajah diambil dari FACE_SERVICE_URL_DOCKER, yang
# bawaannya sudah menunjuk alias jaringan bersama: http://wajah:5005.
#
# Kunci khusus Docker:
#   APP_PORT               port web di komputer induk (bawaan 8080)
#   APP_URL_DOCKER         alamat yang dilihat pengguna (bawaan localhost:8080)
#   APP_ENV_DOCKER         bawaan production
#   APP_DEBUG_DOCKER       bawaan false
#   LOG_CHANNEL_DOCKER     bawaan stderr, supaya masuk ke docker compose logs
#   LOG_LEVEL_DOCKER       bawaan warning
#   DB_HOST_DOCKER         'db' (MySQL dalam compose) atau IP MySQL lain
#   DB_USERNAME_DOCKER     pengguna aplikasi di MySQL
#   DB_PASSWORD_DOCKER     sandi pengguna aplikasi (wajib diisi)
#   DB_ROOT_PASSWORD       sandi root MySQL bawaan compose (wajib diisi)
#   DB_PUBLISH_HOST        bawaan 0.0.0.0, isi 127.0.0.1 bila hanya komputer
#   DB_PUBLISH_PORT        port MySQL untuk klien luar (bawaan 3307)
#   RUN_MIGRATIONS         bawaan true, hanya berpengaruh pada layanan app
#   RUN_OPTIMIZE           bawaan false, hanya berpengaruh pada layanan app
#
# Perintah singkat:
#   docker network create absen-jaringan                    (sekali saja, sebelum pertama)
#   docker compose up -d --build
#   docker compose exec app php artisan db:seed --force     (hanya DB baru)
# ---------------------------------------------------------------------------
name: absen-solat

x-app-lingkungan: &app-lingkungan
    DB_CONNECTION: mysql
    DB_HOST: ${DB_HOST_DOCKER:-db}
    DB_PORT: 3306
    DB_DATABASE: ${DB_DATABASE:-absen_solat}
    DB_USERNAME: ${DB_USERNAME_DOCKER:-absen_solat}
    DB_PASSWORD: ${DB_PASSWORD_DOCKER:?Isi DB_PASSWORD_DOCKER di berkas .env lebih dulu}
    APP_ENV: ${APP_ENV_DOCKER:-production}
    APP_DEBUG: ${APP_DEBUG_DOCKER:-false}
    APP_URL: ${APP_URL_DOCKER:-http://localhost:8080}
    LOG_CHANNEL: ${LOG_CHANNEL_DOCKER:-stderr}
    LOG_LEVEL: ${LOG_LEVEL_DOCKER:-warning}
    TZ: ${APP_TIMEZONE:-Asia/Makassar}
    # Nilai di .env yang memuat rujukan seperti ${APP_NAME} tidak ikut diuraikan
    # oleh env_file, jadi rujukan itu diuraikan di sini.
    MAIL_FROM_NAME: ${APP_NAME:-Absen Solat SMKIM4}
    # Di dalam wadah, 127.0.0.1 menunjuk wadah itu sendiri; nilai dari .env
    # diganti supaya mesin wajah di komputer induk tetap bisa dipanggil.
    FACE_SERVICE_URL: ${FACE_SERVICE_URL_DOCKER:-http://host.docker.internal:5005}

x-app-wadah: &app-wadah
    build:
        context: .
        target: app
    image: absen-solat-app:lokal
    restart: unless-stopped
    env_file:
        - .env
    environment: *app-lingkungan
    volumes:
        # Foto wajah yang menunggu diubah disimpan di storage/app/private, jadi
        # folder storage harus hidup di luar wadah. Kalau tidak, pekerja antrean
        # dan web memakai folder yang berbeda dan unggahan hilang tanpa jejak.
        - storage:/var/www/html/storage
    extra_hosts:
        # Supaya mesin wajah yang berjalan di komputer induk bisa dipanggil dari
        # dalam wadah (FACE_SERVICE_URL=http://host.docker.internal:5005).
        - host.docker.internal:host-gateway
    depends_on:
        db:
            condition: service_healthy
            required: false

services:
    # -------------------------------------------------------------------------
    # MySQL
    # -------------------------------------------------------------------------
    db:
        image: mysql:8.4
        container_name: absen-solat-db
        restart: unless-stopped
        command:
            - --character-set-server=utf8mb4
            - --collation-server=utf8mb4_unicode_ci
            - --default-time-zone=SYSTEM
            - --bind-address=0.0.0.0
        environment:
            MYSQL_DATABASE: ${DB_DATABASE:-absen_solat}
            MYSQL_USER: ${DB_USERNAME_DOCKER:-absen_solat}
            MYSQL_PASSWORD: ${DB_PASSWORD_DOCKER:?Isi DB_PASSWORD_DOCKER di berkas .env lebih dulu}
            MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Isi DB_ROOT_PASSWORD di berkas .env lebih dulu}
            # root boleh masuk dari luar wadah supaya bisa diperiksa dengan
            # HeidiSQL, DBeaver, atau phpMyAdmin. Hanya berlaku saat volume basis
            # data masih kosong. Batasi akses lewat DB_PUBLISH_HOST bila perlu.
            MYSQL_ROOT_HOST: ${DB_ROOT_HOST:-%}
            TZ: ${APP_TIMEZONE:-Asia/Makassar}
        ports:
            # Port dibuka supaya basis datanya bisa diambil dari luar wadah.
            # 0.0.0.0 berarti seluruh jaringan; 127.0.0.1 berarti komputer ini saja.
            - "${DB_PUBLISH_HOST:-0.0.0.0}:${DB_PUBLISH_PORT:-3307}:3306"
        volumes:
            - dbdata:/var/lib/mysql
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    'mysqladmin ping -h 127.0.0.1 -u root --password="$$MYSQL_ROOT_PASSWORD" --silent',
                ]
            interval: 10s
            timeout: 5s
            retries: 30
            start_period: 40s
        networks:
            - absen

    # -------------------------------------------------------------------------
    # Aplikasi: PHP-FPM
    # -------------------------------------------------------------------------
    app:
        <<: *app-wadah
        container_name: absen-solat-app
        environment:
            <<: *app-lingkungan
            RUN_MIGRATIONS: ${RUN_MIGRATIONS:-true}
        networks:
            - absen
            - wajah

    # -------------------------------------------------------------------------
    # nginx: satu-satunya pintu masuk pengguna
    # -------------------------------------------------------------------------
    web:
        build:
            context: .
            target: web
        image: absen-solat-web:lokal
        container_name: absen-solat-web
        restart: unless-stopped
        ports:
            - "${APP_PORT:-8080}:80"
        depends_on:
            app:
                condition: service_started
        networks:
            - absen
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "wget -q -O /dev/null http://127.0.0.1/up || exit 1",
                ]
            interval: 30s
            timeout: 10s
            retries: 5
            start_period: 60s

    # -------------------------------------------------------------------------
    # Pekerja antrean
    #
    # Mengubah foto wajah menjadi angka dikerjakan di sini, bukan di permintaan
    # web, karena satu foto memerlukan belasan detik. Tanpa layanan ini kartu
    # kemajuan unggahan akan berhenti di tengah jalan.
    # -------------------------------------------------------------------------
    queue:
        <<: *app-wadah
        container_name: absen-solat-queue
        command:
            - php
            - artisan
            - queue:work
            - --tries=1
            - --timeout=120
            - --sleep=2
            - --max-time=3600
            - --verbose
        # Pekerja diberi waktu menyelesaikan foto yang sedang diproses sebelum
        # wadah dimatikan, supaya tidak ada baris antrean yang menggantung.
        stop_grace_period: 120s
        healthcheck:
            test:
                ["CMD-SHELL", "php artisan --version >/dev/null 2>&1 || exit 1"]
            interval: 30s
            timeout: 10s
            retries: 5
            start_period: 60s
        # Pekerja antrean ikut disambungkan ke jaringan mesin wajah, sebab
        # pengubahan foto menjadi angka wajah dikerjakan di sini.
        networks:
            - absen
            - wajah

    # -------------------------------------------------------------------------
    # Penjadwal
    #
    # Empat jadwal berjalan di sini dan wajib hidup:
    #   solat:sesi-harian      menyiapkan sesi absen hari ini dan besok,
    #                          sekali sehari pada SOLAT_SESSION_CREATE_TIME
    #   solat:sesi-otomatis    membuka dan menutup sesi setiap menit
    #   solat:bersihkan-bukti  membuang foto bukti absen yang sudah lama
    #   face:purge-uploads     membuang foto wajah sementara setiap hari
    # -------------------------------------------------------------------------
    scheduler:
        <<: *app-wadah
        container_name: absen-solat-scheduler
        command:
            - php
            - artisan
            - schedule:work
        healthcheck:
            test:
                ["CMD-SHELL", "php artisan --version >/dev/null 2>&1 || exit 1"]
            interval: 30s
            timeout: 10s
            retries: 5
            start_period: 60s
        networks:
            - absen

volumes:
    dbdata:
        name: absen-solat-dbdata
    storage:
        name: absen-solat-storage

networks:
    # Jaringan dalam proyek ini sendiri: web, app, queue, scheduler, db.
    absen:
        name: absen-solat

    # Jaringan bersama dengan mesin wajah Python di folder "face absen".
    # Mesin wajah masuk ke sini dengan alias "wajah", jadi alamatnya dari dalam
    # wadah cukup http://wajah:5005 dan portnya tidak perlu dibuka ke komputer
    # induk sama sekali.
    #
    # Sengaja external supaya berkas ini tidak pernah menghapus jaringan itu
    # saat "docker compose down", sebab mesin wajah memakainya juga. Jaringan
    # dibuat sekali dengan perintah:
    #     docker network create absen-jaringan
    wajah:
        name: absen-jaringan
        external: true
