# ---------------------------------------------------------------------------
# nginx untuk Absen Solat SMKIM4
#
# Dua hal yang tidak boleh diubah tanpa alasan:
#
# 1. Hanya IPv4 yang didengar. Menulis pendengar IPv6 (dua titik dua di dalam
#    kurung siku) pernah membuat nginx gagal hidup dengan galat
#    "[emerg] socket() ... failed (97: Address family not supported)" pada
#    mesin yang tidak mendukung IPv6.
#
# 2. Nama layanan app dicari lewat resolver Docker pada setiap permintaan,
#    bukan ditulis langsung. Alamat yang ditulis langsung diingat nginx, jadi
#    setelah wadah app dibangun ulang nginx menembak alamat lama dan semua
#    halaman menjadi 502 padahal aplikasinya sehat.
# ---------------------------------------------------------------------------
server {
    listen 80;
    server_name _;

    root /var/www/html/public;
    index index.php;

    charset utf-8;

    # Batas ukuran kiriman berjenjang. nginx 96 MB lebih longgar daripada
    # post_max_size 64 MB pada php.ini, dan keduanya lebih longgar daripada
    # batas aplikasi (10 foto x 5 MB per anggota). Urutan ini membuat kiriman
    # kelewat besar ditolak aplikasi dengan pesan yang terbaca pengguna,
    # bukan hilang tanpa penjelasan.
    client_max_body_size 96m;
    client_body_timeout 300s;

    access_log /dev/stdout;
    error_log /dev/stderr warn;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico {
        access_log off;
        log_not_found off;
    }

    location = /robots.txt {
        access_log off;
        log_not_found off;
    }

    location ~ \.php$ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $php_upstream app:9000;

        include fastcgi_params;
        fastcgi_pass $php_upstream;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;

        # Pengubahan foto wajah menjadi angka dikerjakan di antrean, jadi
        # permintaan web sudah tidak berjalan lama. Nilai panjang di bawah
        # hanya jaring pengaman supaya tidak ada lagi halaman galat 504.
        fastcgi_read_timeout 600s;
        fastcgi_send_timeout 600s;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
        fastcgi_busy_buffers_size 32k;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
