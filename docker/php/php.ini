; ---------------------------------------------------------------------------
; Pengaturan PHP untuk wadah Absen Solat SMKIM4
;
; Berkas ini disalin ke /usr/local/etc/php/conf.d/zz-absen-solat.ini sehingga
; dibaca paling akhir dan menimpa bawaan citra.
;
; Ukuran kiriman disusun berjenjang (mendukung unggah berkas Restore Backup .zip besar):
;   nginx  client_max_body_size 512m
;   PHP    post_max_size       512m
;   PHP    upload_max_filesize  512m
;   app    satu foto maksimum   5m (maks 10 foto/kiriman), backup .zip maks 500m
; ---------------------------------------------------------------------------

; --- Berkas yang diunggah -------------------------------------------------
upload_max_filesize = 512M
post_max_size = 512M
max_file_uploads = 20
; memory_limit dinaikkan menjadi 768M agar memiliki margin aman di atas post_max_size (512M)
; untuk mencegah Out-of-Memory (OOM) saat proses ekstraksi file backup .zip besar
memory_limit = 768M

; --- Keamanan & Mitigasi PHP2Shell / Error Handling -----------------------
; Mematikan pelacakan upload progress PHP yang rentan UAF saat kondisi OOM (CVE-2026-109618)
session.upload_progress.enabled = Off
; Mencegah fatal-error backtrace membocorkan argumen fungsi dan mencegah UAF state (CVE-2026-109619)
zend.exception_ignore_args = On
display_errors = Off
display_startup_errors = Off

; --- Waktu berjalan -------------------------------------------------------
; Batas waktu sesungguhnya ada di nginx (fastcgi_read_timeout), nilai ini
; hanya untuk pekerjaan yang berjalan di sisi PHP (termasuk membuat/memulihkan .zip).
max_execution_time = 300
max_input_time = 300

; --- opcache --------------------------------------------------------------
; opcache sudah menyatu di citra resmi PHP, jadi tidak diminta ulang lewat
; docker-php-ext-install (permintaan itu membuat pembangunan gagal).
opcache.enable = 1
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
; Tampilan Blade yang sudah dikompilasi hidup di volume storage dan bisa
; berubah tanpa wadah dibangun ulang, jadi penanda waktu tetap diperiksa.
opcache.validate_timestamps = 1
opcache.revalidate_freq = 2

; --- Lain-lain ------------------------------------------------------------
expose_php = off
; Zona waktu aplikasi diatur Laravel lewat APP_TIMEZONE di .env; nilai di sini
; hanya menjadi titik netral untuk PHP di luar Laravel.
date.timezone = UTC
