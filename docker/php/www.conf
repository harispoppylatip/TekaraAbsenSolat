; ---------------------------------------------------------------------------
; Konfigurasi Pool PHP-FPM untuk Trafik Tinggi (Absen Solat SMKIM4)
;
; Bawaan citra resmi php-fpm hanya menyediakan pm.max_children = 5, yang
; langsung habis ketika Kiosk, CCTV, Kamera Petugas, dan puluhan siswa
; mengakses website secara bersamaan.
; ---------------------------------------------------------------------------
[www]
pm = dynamic
pm.max_children = 32
pm.start_servers = 6
pm.min_spare_servers = 4
pm.max_spare_servers = 16
pm.max_requests = 1000
request_terminate_timeout = 300s
